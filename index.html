<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Metagora - Pitch Deck Navigator</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Arial', sans-serif;
            overflow: hidden;
        }
        
        iframe {
            width: 100vw;
            height: 100vh;
            border: none;
            display: block;
        }
        
        
        .slide-counter {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(255, 255, 255, 0.95);
            color: #282222;
            padding: 8px 20px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 600;
            z-index: 10000;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.15);
            border: 1px solid rgba(0, 0, 0, 0.1);
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }
        
        .nav-button {
            position: fixed;
            bottom: 30px;
            background: rgba(255, 255, 255, 0.95);
            color: #282222;
            width: 48px;
            height: 48px;
            border: 1px solid rgba(0, 0, 0, 0.1);
            border-radius: 50%;
            font-size: 20px;
            font-weight: 600;
            cursor: pointer;
            z-index: 10000;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.15);
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }
        
        @media (hover: hover) and (pointer: fine) {
            .nav-button:hover {
                background: rgba(255, 230, 235, 0.95);
                color: #282222;
                transform: translateY(-2px);
                box-shadow: 0 4px 16px rgba(250, 44, 65, 0.2);
            }
        }
        
        .nav-button:active {
            background: rgba(255, 230, 235, 0.95);
            color: #282222;
            transform: translateY(0);
        }
        
        .nav-button:disabled {
            opacity: 0.3;
            cursor: not-allowed;
            background: rgba(200, 200, 200, 0.5);
        }
        
        .nav-button:disabled:hover {
            background: rgba(200, 200, 200, 0.5);
            color: #282222;
            transform: none;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.15);
        }
        
        .nav-button-left {
            left: 30px;
        }
        
        .nav-button-right {
            right: 30px;
        }
        
        .fullscreen-button {
            position: fixed;
            top: 32px;
            right: 32px;
            background: rgba(255, 255, 255, 0.95);
            color: #282222;
            width: 44px;
            height: 44px;
            border: 1px solid rgba(0, 0, 0, 0.1);
            border-radius: 8px;
            font-size: 20px;
            cursor: pointer;
            z-index: 10001;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.15);
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
        }
        
        @media (hover: hover) and (pointer: fine) {
            .fullscreen-button:hover {
                background: rgba(255, 230, 235, 0.95);
                color: #282222;
                transform: scale(1.05);
                box-shadow: 0 4px 16px rgba(250, 44, 65, 0.2);
            }
        }
        
        .fullscreen-button:active {
            background: rgba(255, 230, 235, 0.95);
            color: #282222;
            transform: scale(0.95);
        }
        
        @media (max-width: 768px) {
            .nav-button {
                width: 44px;
                height: 44px;
                font-size: 18px;
                bottom: 20px;
            }
            
            .nav-button-left {
                left: 15px;
            }
            
            .nav-button-right {
                right: 15px;
            }
            
            .slide-counter {
                bottom: 20px;
                font-size: 13px;
                padding: 6px 16px;
            }
            
            .fullscreen-button {
                top: 16px;
                right: 16px;
                width: 40px;
                height: 40px;
                font-size: 18px;
            }
        }
    </style>
</head>
<body>
    <button class="nav-button nav-button-left" id="prevButton" onclick="previousSlide()">←</button>
    <button class="nav-button nav-button-right" id="nextButton" onclick="nextSlide()">→</button>
    <div class="slide-counter" id="slideCounter">1 / 6</div>
    <button class="fullscreen-button" id="fullscreenButton" onclick="toggleFullscreen()">⛶</button>
    
    <iframe id="slideFrame" src="slide-1.html"></iframe>

    <script>
        // Slides actives : 1, 2, 3, 4, 5 et 14 (conclusion)
        const activeSlides = [1, 2, 3, 4, 5, 14];
        let currentIndex = 0; // Index dans le tableau activeSlides
        const slideFrame = document.getElementById('slideFrame');
        const slideCounter = document.getElementById('slideCounter');
        const prevButton = document.getElementById('prevButton');
        const nextButton = document.getElementById('nextButton');
        
        function updateSlide() {
            const currentSlide = activeSlides[currentIndex];
            slideFrame.src = `slide-${currentSlide}.html`;
            slideCounter.textContent = `${currentIndex + 1} / ${activeSlides.length}`;
            
            // Mettre à jour l'état des boutons
            prevButton.disabled = currentIndex === 0;
            nextButton.disabled = currentIndex === activeSlides.length - 1;
            
            // Sauvegarder la position actuelle dans l'URL
            window.history.replaceState({slide: currentSlide}, '', `?slide=${currentSlide}`);
        }
        
        function nextSlide() {
            if (currentIndex < activeSlides.length - 1) {
                currentIndex++;
                updateSlide();
            }
        }
        
        function previousSlide() {
            if (currentIndex > 0) {
                currentIndex--;
                updateSlide();
            }
        }
        
        // Navigation au clavier
        document.addEventListener('keydown', (event) => {
            if (event.key === 'ArrowRight' || event.key === 'Right') {
                event.preventDefault();
                nextSlide();
            } else if (event.key === 'ArrowLeft' || event.key === 'Left') {
                event.preventDefault();
                previousSlide();
            } else if (event.key === 'Home') {
                event.preventDefault();
                currentIndex = 0;
                updateSlide();
            } else if (event.key === 'End') {
                event.preventDefault();
                currentIndex = activeSlides.length - 1;
                updateSlide();
            }
        });
        
        // Support tactile pour mobile
        let touchStartX = 0;
        let touchEndX = 0;
        
        document.addEventListener('touchstart', (event) => {
            touchStartX = event.changedTouches[0].screenX;
        });
        
        document.addEventListener('touchend', (event) => {
            touchEndX = event.changedTouches[0].screenX;
            handleSwipe();
        });
        
        function handleSwipe() {
            const swipeThreshold = 50;
            if (touchEndX < touchStartX - swipeThreshold) {
                nextSlide();
            }
            if (touchEndX > touchStartX + swipeThreshold) {
                previousSlide();
            }
        }
        
        // Charger la slide depuis l'URL si présente
        const urlParams = new URLSearchParams(window.location.search);
        const slideParam = urlParams.get('slide');
        if (slideParam) {
            const slideNumber = parseInt(slideParam);
            const slideIndex = activeSlides.indexOf(slideNumber);
            if (slideIndex !== -1) {
                currentIndex = slideIndex;
                updateSlide();
            }
        }
        
        // Initialiser l'état des boutons
        updateSlide();
        
        // Empêcher le scroll
        document.body.style.overflow = 'hidden';
        
        // Fonction fullscreen universelle
        function toggleFullscreen() {
            const elem = document.documentElement;
            
            if (!document.fullscreenElement && 
                !document.webkitFullscreenElement && 
                !document.mozFullScreenElement && 
                !document.msFullscreenElement) {
                // Entrer en fullscreen
                if (elem.requestFullscreen) {
                    elem.requestFullscreen();
                } else if (elem.webkitRequestFullscreen) { // Safari
                    elem.webkitRequestFullscreen();
                } else if (elem.webkitEnterFullscreen) { // iOS Safari
                    elem.webkitEnterFullscreen();
                } else if (elem.mozRequestFullScreen) { // Firefox
                    elem.mozRequestFullScreen();
                } else if (elem.msRequestFullscreen) { // IE/Edge
                    elem.msRequestFullscreen();
                }
            } else {
                // Sortir du fullscreen
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                } else if (document.webkitExitFullscreen) {
                    document.webkitExitFullscreen();
                } else if (document.mozCancelFullScreen) {
                    document.mozCancelFullScreen();
                } else if (document.msExitFullscreen) {
                    document.msExitFullscreen();
                }
            }
        }
        
        // Mettre à jour l'icône du bouton selon l'état fullscreen
        const fullscreenButton = document.getElementById('fullscreenButton');
        
        function updateFullscreenButton() {
            if (document.fullscreenElement || 
                document.webkitFullscreenElement || 
                document.mozFullScreenElement || 
                document.msFullscreenElement) {
                fullscreenButton.textContent = '⛶';
            } else {
                fullscreenButton.textContent = '⛶';
            }
        }
        
        // Écouter les changements d'état fullscreen
        document.addEventListener('fullscreenchange', updateFullscreenButton);
        document.addEventListener('webkitfullscreenchange', updateFullscreenButton);
        document.addEventListener('mozfullscreenchange', updateFullscreenButton);
        document.addEventListener('MSFullscreenChange', updateFullscreenButton);
        
        // Détecter iPhone et masquer le bouton fullscreen
        function isIPhone() {
            return /iPhone/i.test(navigator.userAgent) || 
                   (/iPad/i.test(navigator.userAgent) && navigator.maxTouchPoints > 1);
        }
        
        if (isIPhone()) {
            fullscreenButton.style.display = 'none';
        }
    </script>
</body>
</html>
