<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Metagora - Slide 10</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@300;400;600;700&family=Roboto:wght@300;400;500;700&family=Poppins:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="slide-10.css">
    <link rel="stylesheet" href="common-mobile.css">
</head>
<body>
    <header class="header">
        <div class="header-content">
            <div class="logo">
                <img src="images/Logo-Metagora-noir-sur-blanc.png" alt="Metagora" class="logo-img">
            </div>
        </div>
    </header>

    <main class="main-content">
        <div class="slides-container" id="slidesContainer">
            <!-- Page 9 : Clients -->
            <section class="slide active" id="slide9">
                <div class="slide-content">
                    <div class="slide-text full-width">
                        <h2 class="slide-title">Nos Clients</h2>
                        <div class="clients-grid">
                            <div class="client-logo">
                                <img src="images/logos-partenairs/Amazon_logo.svg" alt="Amazon" class="client-image">
                            </div>
                            <div class="client-logo">
                                <img src="images/logos-partenairs/LVMH_logo.png" alt="LVMH" class="client-image">
                            </div>
                            <div class="client-logo">
                                <img src="images/logos-partenairs/SONY_logo.svg" alt="Sony" class="client-image">
                            </div>
                            <div class="client-logo">
                                <img src="images/logos-partenairs/macif_logo.jpg" alt="Macif" class="client-image">
                            </div>
                            <div class="client-logo">
                                <img src="images/logos-partenairs/BPCE_logo.png" alt="BPCE" class="client-image">
                            </div>
                        </div>
                    </div>
                </div>
            </section>
        </div>
    </main>
    <script>
        // Détecter iPhone et ajouter une classe au body
        if (/iPhone/i.test(navigator.userAgent) || (/iPad/i.test(navigator.userAgent) && navigator.maxTouchPoints > 1)) {
            document.body.classList.add('iphone-device', 'extra-offset');
        }
    </script>
</body>
</html>
