<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Metagora - Slide 5</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@300;400;600;700&family=Roboto:wght@300;400;500;700&family=Poppins:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="slide-5.css">
</head>
<body>
    <header class="header">
        <div class="header-content">
            <div class="logo">
                <img src="images/Logo-Metagora-noir-sur-blanc.png" alt="Metagora" class="logo-img">
            </div>
        </div>
    </header>

    <main class="main-content">
        <div class="slides-container" id="slidesContainer">
            <!-- Page 5 - Solution Metagora -->
            <section class="slide active" id="slide5">
                <div class="slide-content">
                    <div class="two-statements-container">
                        <div class="statement statement-fact">
                            <p class="statement-main">Avec Metagora, <span class="highlight-stat">120 ventes</span> sont faites en <span class="highlight-stat">10 heures</span></p>
                        </div>
                        
                        <div class="statement-divider"></div>
                        
                        <div class="statement statement-result">
                            <p class="statement-main">Ce qui génère <span class="highlight-stat">5%</span> de CA en plus par boutique par mois</p>
                        </div>
                    </div>
                </div>
            </section>
        </div>
    </main>
</body>
</html>
