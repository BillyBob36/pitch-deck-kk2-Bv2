<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Metagora - Slide 11</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@300;400;600;700&family=Roboto:wght@300;400;500;700&family=Poppins:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="slide-11.css">
    <link rel="stylesheet" href="common-mobile.css">
</head>
<body>
    <header class="header">
        <div class="header-content">
            <div class="logo">
                <img src="images/Logo-Metagora-noir-sur-blanc.png" alt="Metagora" class="logo-img">
            </div>
        </div>
    </header>

    <main class="main-content">
        <div class="slides-container" id="slidesContainer">
            <!-- Page 10 : Cas Clients -->
            <section class="slide active" id="slide10">
                <div class="slide-content">
                    <div class="slide-text full-width">
                        <h2 class="slide-title">Nos réalisations</h2>
                        <div class="case-grid">
                            <div class="case-item">
                                <div class="case-images">
                                    <img src="images/lvmh-demo.jpg" alt="Demo LVMH" class="case-demo">
                                    <img src="images/logo-lvmh.png" alt="LVMH" class="case-logo">
                                </div>
                                <div class="case-content">
                                    <h3>Make Up Forever</h3>
                                    <p>Lancement d'un nouveau produit maquillage, formation US, Asie et France en simultané.</p>
                                    <p class="case-stat">400 collaborateurs.</p>
                                </div>
                            </div>
                            
                            <div class="case-item">
                                <div class="case-images">
                                    <img src="images/amazon-demo.png" alt="Demo Amazon" class="case-demo">
                                    <img src="images/logo-amazon.png" alt="Amazon" class="case-logo">
                                </div>
                                <div class="case-content">
                                    <h3>Formation de directeurs</h3>
                                    <p>"Serious Game" de gestion d'entreprise pour les directeurs de Amazon Global.</p>
                                    <p class="case-stat">Déploiement dans 6 pays dont le Japon.</p>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </section>
        </div>
    </main>
    <script>
        // Détecter iPhone et ajouter une classe au body
        if (/iPhone/i.test(navigator.userAgent) || (/iPad/i.test(navigator.userAgent) && navigator.maxTouchPoints > 1)) {
            document.body.classList.add('iphone-device', 'extra-offset');
        }
    </script>
</body>
</html>
