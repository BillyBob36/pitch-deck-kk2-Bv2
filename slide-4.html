<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Metagora - Slide 4</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@300;400;600;700&family=Roboto:wght@300;400;500;700&family=Poppins:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="slide-4.css">
    <link rel="stylesheet" href="common-mobile.css">
</head>
<body>
    <header class="header">
        <div class="header-content">
            <div class="logo">
                <img src="images/Logo-Metagora-noir-sur-blanc.png" alt="Metagora" class="logo-img">
            </div>
        </div>
    </header>

    <main class="main-content">
        <div class="slides-container" id="slidesContainer">
            <!-- Partie 4 - Deux phrases -->
            <section class="slide active" id="slide4">
                <div class="slide-content">
                    <div class="two-statements-container">
                        <div class="statement statement-fact">
                            <p class="statement-main">Une boutique est vide <span class="highlight-stat">70%</span> du temps</p>
                        </div>
                        
                        <div class="statement-divider"></div>
                        
                        <div class="statement statement-question">
                            <p class="statement-main">Et si le vendeur se formait à la vente pendant ce temps ?</p>
                        </div>
                    </div>
                </div>
            </section>
        </div>
    </main>
</body>
</html>
