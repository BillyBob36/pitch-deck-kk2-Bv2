<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Metagora - Slide 16</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@300;400;600;700&family=Roboto:wght@300;400;500;700&family=Poppins:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="slide-16.css">
</head>
<body>
    <header class="header">
        <div class="header-content">
            <div class="logo">
                <img src="images/Logo-Metagora-noir-sur-blanc.png" alt="Metagora" class="logo-img">
            </div>
        </div>
    </header>

    <main class="main-content">
        <div class="slides-container" id="slidesContainer">
            <!-- Page 15 - Merci -->
            <section class="slide active" id="slide15">
                <div class="slide-content">
                    <div class="slide-grid thank-you-grid">
                        <div class="thank-you-left">
                            <h2 class="thank-you-title">Merci pour<br>Votre Confiance</h2>
                            <p class="thank-you-subtitle">Restons en contact !</p>
                            <div class="qr-code-container">
                                <img src="images/qr-code.png" alt="QR Code" class="qr-code-image">
                            </div>
                        </div>
                        <div class="thank-you-right">
                            <img src="images/une-equipe-pratique-sur-ordi.png" alt="Équipe Metagora" class="thank-you-team-image">
                        </div>
                    </div>
                </div>
            </section>
        </div>
    </main>
</body>
</html>
