<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Metagora - Slide 6</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@300;400;600;700&family=Roboto:wght@300;400;500;700&family=Poppins:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="slide-6.css">
</head>
<body>
    <header class="header">
        <div class="header-content">
            <div class="logo">
                <img src="images/Logo-Metagora-noir-sur-blanc.png" alt="Metagora" class="logo-img">
            </div>
        </div>
    </header>

    <main class="main-content">
        <div class="slides-container" id="slidesContainer">
            <!-- Page 6 : Metagora le simulateur -->
            <section class="slide active" id="slide6">
                <div class="slide-content">
                    <div class="value-proposition-container">
                        <h2 class="main-title">Metagora : le simulateur de vente</h2>
                        
                        <div class="value-statement">
                            <p class="statement-line">L'efficacité de la formation présentielle en continu pour <span class="highlight-price">1200€/an</span> par boutique</p>
                        </div>
                        
                        <div class="value-statement">
                            <p class="statement-line">En moyenne, une boutique c'est <span class="highlight-number">500 000€</span> de CA. Avec Metagora c'est <span class="highlight-number">25 000€</span> de CA en plus</p>
                        </div>
                        
                        <div class="value-statement result-statement">
                            <p class="statement-line">Soit <span class="highlight-result">23 800€</span> de bénéfice par an par boutique</p>
                        </div>
                    </div>
                </div>
            </section>
        </div>
    </main>
</body>
</html>
