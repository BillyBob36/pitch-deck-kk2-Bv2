<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Metagora - Slide 2</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@300;400;600;700&family=Roboto:wght@300;400;500;700&family=Poppins:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="slide-2.css">
    <link rel="stylesheet" href="common-mobile.css">
</head>
<body>
    <header class="header">
        <div class="header-content">
            <div class="logo">
                <img src="images/Logo-Metagora-noir-sur-blanc.png" alt="Metagora" class="logo-img">
            </div>
        </div>
    </header>

    <main class="main-content">
        <div class="slides-container" id="slidesContainer">
            <!-- Page 2 - Marché Retail (Design Apple) -->
            <section class="slide active" id="slide2">
                <div class="slide-content">
                    <div class="slide-grid apple-style">
                        <div class="slide-text apple-text">
                            <h2 class="apple-title">Le marché du retail c'est :</h2>
                            <div class="apple-stats">
                                <div class="apple-stat-card">
                                    <div class="apple-stat-number">25 000 Mds€</div>
                                    <div class="apple-stat-label">de CA / an</div>
                                </div>
                                <div class="apple-stat-card">
                                    <div class="apple-stat-number">20 000 Mds€</div>
                                    <div class="apple-stat-label">générés en boutique</div>
                                </div>
                            </div>
                        </div>
                        <div class="slide-image apple-image">
                            <div class="apple-device-frame">
                                <img src="images/avatar-pose-statistiques.png" alt="Statistiques" class="avatar-image">
                            </div>
                        </div>
                    </div>
                </div>
            </section>
        </div>
    </main>
</body>
</html>
