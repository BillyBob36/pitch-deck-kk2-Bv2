<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Metagora - Slide 3</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@300;400;600;700&family=Roboto:wght@300;400;500;700&family=Poppins:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="slide-3.css">
    <link rel="stylesheet" href="common-mobile.css">
</head>
<body>
    <header class="header">
        <div class="header-content">
            <div class="logo">
                <img src="images/Logo-Metagora-noir-sur-blanc.png" alt="Metagora" class="logo-img">
            </div>
        </div>
    </header>

    <main class="main-content">
        <div class="slides-container" id="slidesContainer">
            <!-- Page 3 - Rentabilité vendeur -->
            <section class="slide active" id="slide3">
                <div class="slide-content">
                    <div class="centered-statement">
                        <p class="statement-text">
                            Un vendeur boutique est rentable après 
                            <span class="highlight-number">3 mois</span> 
                            soit 
                            <span class="highlight-number">120 ventes</span>
                        </p>
                    </div>
                </div>
            </section>
        </div>
    </main>
</body>
</html>
