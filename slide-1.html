<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Metagora - Slide 1</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@300;400;600;700&family=Roboto:wght@300;400;500;700&family=Poppins:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="slide-1.css">
    <link rel="stylesheet" href="common-mobile.css">
</head>
<body>
    <header class="header">
        <div class="header-content">
            <div class="logo">
                <img src="images/Logo-Metagora-noir-sur-blanc.png" alt="Metagora" class="logo-img">
            </div>
        </div>
    </header>

    <main class="main-content">
        <div class="slides-container" id="slidesContainer">
            <!-- Page 1 -->
            <section class="slide active" id="slide1">
                <div class="slide-content">
                    <div class="slide-grid">
                        <div class="slide-text">
                            <h1 class="slide-title">Le client Virtuel de<br>tous les vendeurs</h1>
                            
                            <div class="info-cards">
                                <div class="info-card">
                                    <p class="card-text">Une infinité de clients pour transformer chaque nouveau vendeur en conseiller de vente senior</p>
                                </div>
                                
                                <div class="info-card highlight-card">
                                    <span class="card-label">Pitch Deck</span>
                                    <span class="card-highlight">+30% de CA magasin en+</span>
                                </div>
                            </div>
                        </div>
                        <div class="slide-image">
                            <img src="images/les-deux-avatar-sur-une-image-stylée.png" alt="Avatars Metagora" class="avatar-image">
                        </div>
                    </div>
                </div>
            </section>
        </div>
    </main>
    <script>
        // Détecter iPhone et ajouter une classe au body
        if (/iPhone/i.test(navigator.userAgent) || (/iPad/i.test(navigator.userAgent) && navigator.maxTouchPoints > 1)) {
            document.body.classList.add('iphone-device');
        }
    </script>
</body>
</html>
